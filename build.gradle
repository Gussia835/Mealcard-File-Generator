plugins {
    id 'java'
    id 'application'
    id 'jacoco'
    id 'idea'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
    id 'com.google.protobuf' version '0.10.0'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'net.datafaker:datafaker:2.7.0'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'io.rest-assured:rest-assured:5.4.0'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testImplementation 'org.awaitility:awaitility:4.2.1'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.apiguardian:apiguardian-api:1.1.2'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'

    implementation 'org.apache.tika:tika-core:2.9.2'
    implementation 'org.apache.tika:tika-parser-text-module:2.9.2'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.6.4'
    implementation 'com.google.protobuf:protobuf-java:3.25.3'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'io.grpc:grpc-netty-shaded:1.64.0'
    implementation 'io.grpc:grpc-protobuf:1.64.0'
    implementation 'io.grpc:grpc-stub:1.64.0'


    implementation 'net.datafaker:datafaker:2.7.0'
    implementation 'org.slf4j:slf4j-api:2.0.16'
    implementation 'ch.qos.logback:logback-classic:1.5.12'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2'
    implementation 'org.apache.commons:commons-lang3:3.17.0'
    // implementation "org.sonarsource.scanner.gradle:sonarqube-gradle-plugin:6.2.0.5505@jar"
}



tasks.register('integrationTest', Test) {
    useJUnitPlatform()
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
}

shadowJar {
    archiveBaseName.set('FileGenerator')   // sv-adapter
    archiveVersion.set('1.0')           // -1.0
    archiveClassifier.set('all')        // -all

    mergeServiceFiles()

    manifest {
        attributes 'Main-Class': 'ru.mealcard.GeneratorCards'
    }
}

application {
    mainClass = 'ru.mealcard.GeneratorCards'
    applicationDefaultJvmArgs = ["-Dfile.encoding=UTF-8"]
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec).configureEach {
    systemProperty 'file.encoding', 'UTF-8'
}

compileJava.options.encoding = 'UTF-8' // устанавливает кодировку для компилируемого кода
javadoc.
        options.encoding = 'UTF-8' // устанавливает кодировку для генерируемой документации
compileTestJava.
        options.encoding = 'UTF-8'

test {
    useJUnitPlatform()
}

sourceSets {
    test {
        java {
            srcDir 'src/test/java'
        }
        resources {
            srcDir 'src/test/resources'
        }
    }

    integrationTest {
        java {
            srcDir 'src/integrationTest/java'
            compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
            runtimeClasspath += output + compileClasspath
        }

        resources {
            srcDir 'src/integrationTest/resources'
        }
    }
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.3'
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.64.0'
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}